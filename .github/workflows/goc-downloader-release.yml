# Windows NSIS release for Game of Creators Desktop Downloader (apps/goc-downloader).
# Builds artifacts, prints SHA256 checksums, and documents code-signing secret placeholders.
#
# Required repository secrets (configure in GitHub; never commit real values):
#   GOC_DOWNLOADER_WINDOWS_CERTIFICATE_PFX_BASE64  — optional Authenticode PFX (base64)
#   GOC_DOWNLOADER_WINDOWS_CERTIFICATE_PASSWORD    — optional PFX password
#   TAURI_SIGNING_PRIVATE_KEY                     — optional Tauri updater key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD            — optional
#
# Public verification key for .gocdownload manifests is distributed with the app;
# server signing private key stays in Vercel/env (GOC_DOWNLOAD_SIGNING_PRIVATE_KEY).

name: goc-downloader-release

on:
  push:
    tags:
      - "goc-downloader-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag override (optional)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: goc-downloader-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows NSIS
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/goc-downloader

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/goc-downloader/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch and verify pinned sidecars
        run: npm run fetch-sidecars

      - name: Release preflight (public keys)
        shell: pwsh
        run: |
          $keysPath = "src-tauri/resources/public_keys.json"
          if (-not (Test-Path $keysPath)) {
            Write-Error "Missing $keysPath"
            exit 1
          }
          $keys = Get-Content $keysPath -Raw | ConvertFrom-Json
          if (-not $keys.keys -or $keys.keys.Count -lt 1) {
            Write-Error "public_keys.json has no keys"
            exit 1
          }
          foreach ($key in $keys.keys) {
            if ($key.publicKeyBase64 -eq "REPLACE_AFTER_KEYGEN") {
              Write-Error "public_keys.json still contains REPLACE_AFTER_KEYGEN placeholder"
              exit 1
            }
            if ($env:GOC_DOWNLOAD_REQUIRE_PROD_KEYS -eq "true" -and $key.keyId -like "dev-*") {
              Write-Error "Release requires production keyId (found $($key.keyId)). Set GOC_DOWNLOAD_REQUIRE_PROD_KEYS=false only for unsigned/dev builds."
              exit 1
            }
          }
          if (-not (Test-Path "src-tauri/resources/sidecar-checksums.json")) {
            Write-Error "Missing sidecar binary checksums — fetch-sidecars must write resources/sidecar-checksums.json"
            exit 1
          }
          Write-Host "Public key preflight OK ($($keys.keys.Count) key(s))"

      - name: Configure code signing (optional — manual provisioning)
        shell: pwsh
        env:
          GOC_DOWNLOADER_WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.GOC_DOWNLOADER_WINDOWS_CERTIFICATE_PFX_BASE64 }}
          GOC_DOWNLOADER_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.GOC_DOWNLOADER_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:GOC_DOWNLOADER_WINDOWS_CERTIFICATE_PFX_BASE64) {
            Write-Host "No Authenticode PFX secret configured; building unsigned installer."
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "goc-downloader-codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:GOC_DOWNLOADER_WINDOWS_CERTIFICATE_PFX_BASE64))
          echo "WINDOWS_CERTIFICATE_PATH=$pfxPath" >> $env:GITHUB_ENV
          echo "WINDOWS_CERTIFICATE_PASSWORD=$env:GOC_DOWNLOADER_WINDOWS_CERTIFICATE_PASSWORD" >> $env:GITHUB_ENV

      - name: Build Tauri NSIS installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build

      - name: Collect artifacts and checksums
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/release/bundle"
          if (-not (Test-Path $bundle)) {
            Write-Error "Bundle output missing at $bundle"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path "release-out" | Out-Null
          Get-ChildItem -Path $bundle -Recurse -Include *.exe,*.msi,*.nsis.zip |
            ForEach-Object {
              Copy-Item $_.FullName -Destination "release-out/$($_.Name)" -Force
            }
          $checksumFile = "release-out/SHA256SUMS.txt"
          Get-ChildItem "release-out" -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content $checksumFile
            Write-Host "$hash  $($_.Name)"
          }
          if (-not (Test-Path $checksumFile)) {
            Write-Error "No installer artifacts found under $bundle"
            exit 1
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: goc-downloader-windows
          path: apps/goc-downloader/release-out/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/goc-downloader/release-out/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
